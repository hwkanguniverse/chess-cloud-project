# Apply every root when main changes, then prove the API still answers.
#
# main only moves by a merged PR whose plan was read, so this applies what was
# reviewed - re-planned at apply time rather than from the reviewed plan file,
# accepted with one author (see the decision log). The role it assumes is
# admin; the trust policy in terraform/ci is what limits who can reach it.

name: apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - "web/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch: # re-run by hand, e.g. after a failed apply

permissions:
  id-token: write
  contents: read

# Never two applies at once, and never cancel one mid-flight: a cancelled
# apply can leave a root half-changed. A second push waits its turn.
concurrency:
  group: apply
  cancel-in-progress: false

env:
  # Dependency order - each reads the ones before it through remote state.
  # bootstrap and ci are applied by hand, never here.
  ROOTS: guardrails network data queue auth worker api web

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  apply:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the image tag is read from history

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961868442307:role/chess-cloud-ci-apply
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # The worker image is tagged with the last commit that changed
      # app/worker/, so the task definition names the exact code it runs and a
      # rollback is a revert. Built before any root is applied: the worker
      # root points both services at this tag, so the image must exist first.
      # Skipped when the tag is already in ECR - tags are immutable, and a
      # rebuild of the same commit could only differ by accident.
      - name: Build and push the worker image
        run: |
          tag=$(git log -1 --format=%H -- app/worker | cut -c1-12)
          echo "TF_VAR_image_tag=$tag" >> "$GITHUB_ENV"
          repo=961868442307.dkr.ecr.ap-southeast-1.amazonaws.com/chess-cloud-worker
          if aws ecr describe-images --repository-name chess-cloud-worker --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "image $tag already in ECR, not rebuilding"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker build -t "$repo:$tag" app/worker
          # The pin is the point of the build - prove it held.
          test "$(docker run --rm --entrypoint dpkg-query "$repo:$tag" -W -f='${Version}' stockfish)" = "17-1"
          docker push "$repo:$tag"

      # Stops at the first root that fails: later roots read its outputs, and
      # applying them against a half-applied dependency is how a partial
      # failure becomes a confusing one. Re-running converges.
      - name: Apply each root
        run: |
          for root in $ROOTS; do
            echo "::group::$root"
            terraform -chdir="terraform/$root" init -input=false -no-color
            terraform -chdir="terraform/$root" apply -auto-approve -input=false -no-color
            echo "::endgroup::"
          done

      # Terraform owns the bucket and distribution; this owns what is in them.
      # Built here rather than committed, from the live stack's outputs, so the
      # bundle can never point at an API or user pool that does not exist.
      # Hashed assets are cached for a year - a new build has new names - and
      # index.html is never cached, so one invalidation of it is the whole
      # rollout. Invalidating /* instead would spend the free 1,000 paths/month
      # on files that cannot be stale.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and publish the web app
        working-directory: web
        run: |
          export VITE_API_URL=$(terraform -chdir=../terraform/api output -raw api_endpoint)
          export VITE_USER_POOL_ID=$(terraform -chdir=../terraform/auth output -raw user_pool_id)
          export VITE_USER_POOL_CLIENT_ID=$(terraform -chdir=../terraform/auth output -raw user_pool_client_id)
          npm ci
          npm run build
          bucket=$(terraform -chdir=../terraform/web output -raw bucket)
          aws s3 sync dist/assets "s3://$bucket/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$bucket" --delete --exclude "assets/*" --cache-control "no-cache"
          # Old hashed assets go last, so a browser holding the previous
          # index.html can still fetch what it references until it reloads.
          aws s3 sync dist/assets "s3://$bucket/assets" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform -chdir=../terraform/web output -raw distribution_id)" \
            --paths /index.html

      # A green apply is not a working app. Phase 4's outage was exactly this:
      # the apply succeeded and every /player returned 500 for five minutes
      # while an IAM grant propagated. Retries cover normal propagation; an
      # outage longer than that turns the run red, which is the point.
      - name: Smoke test the API
        run: |
          api=$(terraform -chdir=terraform/api output -raw api_endpoint)
          site=$(terraform -chdir=terraform/web output -raw url)
          for attempt in $(seq 1 12); do
            players=$(curl -s -o /dev/null -w '%{http_code}' "$api/players")
            player=$(curl -s -o /dev/null -w '%{http_code}' "$api/player/chesscom/hikaru")
            # A deep link, not /: it must come back as the app (SPA fallback),
            # not as S3's 403.
            web=$(curl -s -o /dev/null -w '%{http_code}' "$site/player/chesscom/hikaru")
            echo "attempt $attempt: /players $players, /player/chesscom/hikaru $player, site deep link $web"
            if [ "$players" = 200 ] && [ "$player" = 200 ] && [ "$web" = 200 ]; then exit 0; fi
            sleep 10
          done
          echo "::error::API not healthy two minutes after apply"
          exit 1

      # Last, so it sees what this apply left behind. Replaces "run it by
      # hand after every apply", which depended on remembering. Checks the
      # invariants a plan cannot see as wrong - scale-to-zero, the VPC, the
      # alert path, and the trust on the role this job is running as.
      - name: Drift check
        run: bash scripts/check-drift.sh
