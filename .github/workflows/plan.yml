# Plan every root on a pull request and post the result on the PR.
#
# This is the review step: a change that would replace a resource (a replaced
# table is every game gone) is read here, before merge, rather than in a log
# after the apply. Read-only - it assumes chess-cloud-ci-plan, which cannot
# change anything, and plans without taking the state lock.
#
# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# different code after it was trusted.

name: plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - "app/**"
      - "web/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  id-token: write # to request the OIDC token AWS trusts
  contents: read
  pull-requests: write # to post the plan

# A newer push to the same PR makes an older plan irrelevant.
concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Dependency order. bootstrap and ci are applied by hand and never planned
  # here: CI must not be able to touch the state bucket or its own trust.
  ROOTS: guardrails network data queue auth worker api web

jobs:
  # Runs beside the plan rather than before it, so a failing check still
  # leaves the plan on the PR to read.
  checks:
    uses: ./.github/workflows/checks.yml

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the image tag is read from history

      # The worker root has no default tag, by design - see terraform/worker.
      # The plan shows the tag the merge would deploy; the image itself is
      # built only by apply.
      - name: Worker image tag
        run: echo "TF_VAR_image_tag=$(git log -1 --format=%H -- app/worker | cut -c1-12)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961868442307:role/chess-cloud-ci-plan
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false # plain exit codes and output

      - name: Plan each root
        id: plan
        run: |
          mkdir -p "$RUNNER_TEMP/plans"
          failed=0
          for root in $ROOTS; do
            out="$RUNNER_TEMP/plans/$root.txt"
            # -detailed-exitcode: 0 no changes, 1 error, 2 changes.
            set +e
            terraform -chdir="terraform/$root" init -input=false -no-color > "$out.init" 2>&1 \
              && terraform -chdir="terraform/$root" plan -lock=false -input=false -no-color -detailed-exitcode > "$out" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then echo "no changes" > "$out.status"
            elif [ "$code" -eq 2 ]; then grep -E '^Plan:' "$out" > "$out.status" || echo "changes" > "$out.status"
            else
              echo "FAILED" > "$out.status"; failed=1
              [ -s "$out" ] || cp "$out.init" "$out"
            fi
            echo "$root: $(cat "$out.status")"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post the plan on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const dir = `${process.env.RUNNER_TEMP}/plans`;
            const marker = '<!-- terraform-plan -->';
            const roots = process.env.ROOTS.split(' ');
            // A PR comment holds 65,536 characters; each root's detail is
            // cut so one large plan cannot push the others out.
            const budget = Math.floor(55000 / roots.length);

            let body = `${marker}\n### Terraform plan — \`${context.sha.slice(0, 7)}\`\n\n| Root | Result |\n|---|---|\n`;
            for (const r of roots) {
              body += `| \`${r}\` | ${fs.readFileSync(`${dir}/${r}.txt.status`, 'utf8').trim()} |\n`;
            }
            for (const r of roots) {
              const status = fs.readFileSync(`${dir}/${r}.txt.status`, 'utf8').trim();
              if (status === 'no changes') continue;
              let text = fs.readFileSync(`${dir}/${r}.txt`, 'utf8');
              // Keep what will change, not the refresh chatter above it.
              const start = text.indexOf('Terraform will perform');
              if (start > 0) text = text.slice(start);
              if (text.length > budget) text = text.slice(0, budget) + '\n… truncated — full plan in the run log';
              body += `\n<details><summary><code>${r}</code> — ${status}</summary>\n\n\`\`\`\n${text}\n\`\`\`\n</details>\n`;
            }
            body += `\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            // One comment per PR, updated in place, so the newest plan is
            // the only one on the page.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const mine = comments.find(c => c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if any root failed to plan
        if: steps.plan.outputs.failed == '1'
        run: exit 1
